  __JOB_ID__:
    name: __JOB_LABEL__ - Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: __WORKDIR__
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '__NODE_VERSION__'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: ESLint (zero warnings)
        run: npm run lint -- --max-warnings=0

      - name: Tests
        run: __TEST_COMMAND__

      - name: Build
        run: npm run build
__OPTIONAL_STEPS__
