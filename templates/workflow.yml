name: SENVYR - Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - preprod
      - main
      - prod
  push:
    branches:
      - develop
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
__NODE_JOBS__
  security:
    name: Security - Gitleaks and Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout with full Git history
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks - working tree
        run: |
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir . --redact=100

      - name: Gitleaks - Git history
        run: |
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . --redact=100

      - name: Trivy - HIGH and CRITICAL dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.76.2'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: 'false'
          skip-dirs: '**/node_modules'
          format: 'table'
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
