name: senvyr-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.5
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Le mot de passe Grafana manque dans monitoring/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_METRICS_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/opt/senvyr/dashboards:ro
    ports:
      - 127.0.0.1:3001:3000

  loki-volume-init:
    image: busybox:1.36
    restart: "no"
    user: "0:0"
    network_mode: none
    command: ["sh", "-c", "chown 10001:10001 /data"]
    volumes:
      - loki-data:/data

  loki:
    image: grafana/loki:3.7.0
    restart: unless-stopped
    depends_on:
      loki-volume-init:
        condition: service_completed_successfully
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/tmp/loki

  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./runtime-logs:/var/log/senvyr:ro
      - alloy-data:/var/lib/alloy/data

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
